function luTrackIdx(color,pos){if(pos<1||pos>51)return -1;return (LU_START[color]+pos-1)%52}
function luCellOf(color,pos){if(pos<1)return null;if(pos<=51)return LU_PATH[luTrackIdx(color,pos)];if(pos<=56)return LU_HOME[color][pos-52];return null}
function luLegal(tokens,d){const out=[];for(let i=0;i<4;i++){const p=tokens[i];if(p===0){if(d===6)out.push(i)}else if(p<57&&p+d<=57)out.push(i)}return out}
function luCapsAt(players,pi,np){if(np<1||np>51)return [];const idx=luTrackIdx(players[pi].color,np);if(LU_SAFE.has(idx))return [];const out=[];players.forEach((pl,j)=>{if(j===pi)return;pl.tokens.forEach((p,k)=>{if(p>=1&&p<=51&&luTrackIdx(pl.color,p)===idx)out.push([j,k])})});return out}
function luCaptures(players,pi,ti,d){return luCapsAt(players,pi,players[pi].tokens[ti]+d)}
function luBotPick(players,pi,d){const me=players[pi],legal=luLegal(me.tokens,d);if(!legal.length)return -1;let best=-1,bs=-1e9;
 for(const ti of legal){const p=me.tokens[ti],np=p+d;let s=0;
  if(np===57)s+=80;
  if(p===0)s+=60;
  if(np>=1&&np<=51){const idx=luTrackIdx(me.color,np);if(LU_SAFE.has(idx))s+=40;
   const cap=luCaptures(players,pi,ti,d);if(cap.length)s+=100*cap.length;
   if(!LU_SAFE.has(idx)){let danger=false;players.forEach((pl,j)=>{if(j===pi)return;pl.tokens.forEach(q=>{if(q>=1&&q<=51){const dist=(idx-luTrackIdx(pl.color,q)+52)%52;if(dist>=1&&dist<=6)danger=true}})});
    if(danger)s-=30}}
  s+=Math.min(p,51)/10;
  if(s>bs){bs=s;best=ti}}
 return best}

 $('ss').onclick=()=>{S.nm=($('sn').value.replace(/[<>"']/g,'').trim())||'Player';S.av=av;S.snd=$('s1').checked;S.acc={m:$('sm').value,t:$('st2').value.replace(/[<>"']/g,'').trim(),n:$('sa').value.replace(/[\s-]/g,'').toUpperCase()};save();m.style.display='none';go(tab)};
 $('pc').onclick=async()=>{const e=$('pe'),us=usersG(),u=us[UID];e.style.color='';if(!u){e.textContent='Please log in first';return}

// ---- Auth ----
const AU={mem:{}};
function lsg(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return AU.mem[k]||null}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}AU.mem[k]=v}
const usersG=()=>{try{return JSON.parse(lsg('rg_users')||'{}')}catch(e){return {}}};
const normId=v=>{v=v.trim();return v.includes('@')?v.toLowerCase():v.replace(/[\s\-+()]/g,'')};
const okId=id=>id.includes('@')?/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(id):/^\d{10,13}$/.test(id);
async function hp(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;const t=s+p;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'f'+h}}
let cap='';
function newCap(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';cap='';for(let i=0;i<5;i++)cap+=ch[Math.floor(Math.random()*ch.length)];const c=$('cpc');if(!c)return;const x=c.getContext('2d');x.fillStyle='#fff4e0';x.fillRect(0,0,150,46);
 for(let i=0;i<6;i++){x.strokeStyle='hsl('+Math.random()*360+',60%,55%)';x.lineWidth=1.5;x.beginPath();x.moveTo(Math.random()*150,Math.random()*46);x.lineTo(Math.random()*150,Math.random()*46);x.stroke()}
 x.font='bold 28px sans-serif';x.textBaseline='middle';for(let i=0;i<5;i++){x.save();x.translate(14+i*27,24);x.rotate((Math.random()-.5)*.6);x.fillStyle='hsl('+Math.random()*360+',70%,35%)';x.fillText(cap[i],-9,0);x.restore()}
 for(let i=0;i<40;i++){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(Math.random()*150,Math.random()*46,2,2)}}
function enter(id,nm,isNew,rf){SYNC.ready=false;lss('rg_sess',id);UID=id;loadS();if(isNew){S.nm=nm;if(rf){S.used=rf;S.coins+=CFG.frB}}save();syncOnLogin();try{localStorage.removeItem('rg_ref')}catch(e){}$('au').style.display='none';hdr();initAds();go('home')}
function logout(){SYNC.ready=false;try{localStorage.removeItem('rg_sess')}catch(e){}AU.mem.rg_sess='';UID=null;S=DEF();const m=$('mo');m.style.display='none';closeGame();stopAds();showAuth('in')}
function showAuth(mode){const su=mode=='up',fg=mode=='fg';let m=$('au');if(!m){m=document.createElement('div');m.id='au';document.body.appendChild(m)}m.style.display='block';m.scrollTop=0;
 const fi=(ic,h)=>`<div class='fi'><span>${ic}</span>${h}</div>`;
 m.innerHTML=`<div class='in'><div class='lg'>👑</div><h1>Free Paisa</h1><p style='opacity:.85;margin:0'>Play free games · Earn rewards</p>
 <div class='ac'>${fg?`<h3 style='margin:0 0 4px'>🔑 Reset password</h3><p style='opacity:.75;font-size:13px;margin:0'>Enter your account and the full name you used when signing up.</p>`:`<div class='tabs'><button id='t1' class='${su?'on':''}'>Sign up</button><button id='t2' class='${su?'':'on'}'>Log in</button></div>`}
 ${su?fi('👤',`<input id='an' placeholder='Full name' maxlength='30' autocomplete='name'>`):''}
 <div class='tabs' style='margin-top:12px'><button id='k1' class='${AU.it!='e'?'on':''}'>📱 Mobile</button><button id='k2' class='${AU.it=='e'?'on':''}'>✉️ Email</button></div>${fi(AU.it=='e'?'✉️':'📱',`<input id='ai' type='${AU.it=='e'?'email':'tel'}' inputmode='${AU.it=='e'?'email':'tel'}' placeholder='${AU.it=='e'?'Email address':'Mobile number (03XXXXXXXXX)'}' autocomplete='username'>`)}
 ${fg?fi('👤',`<input id='an' placeholder='Full name (as registered)' maxlength='30'>`):''}
 ${fi('🔒',`<input id='ap' type='password' placeholder='${fg?'New password':'Password'}' autocomplete='${su||fg?'new-password':'current-password'}'>`)}
 ${su||fg?fi('🔒',`<input id='ac' type='password' placeholder='Confirm password' autocomplete='new-password'>`):''}
 ${su?fi('🎁',`<input id='ar' placeholder='Referral code (optional)' maxlength='7' autocapitalize='characters' value='${RF}'>`)+(RF?`<small class='ok'>✓ Referral code applied automatically</small>`:''):''}
 <label class='sh'><input type='checkbox' id='ash'> Show password</label>
 ${su?`<div class='cp'><canvas id='cpc' width='150' height='46'></canvas><button id='cpr' type='button'>↻</button></div>`+fi('🧩',`<input id='ax' placeholder='Type the characters above' autocapitalize='characters' maxlength='5'>`):''}
 <div id='ae' class='er'></div><button class='b' id='ago'>${su?'Sign up':fg?'Reset password':'Log in'}</button>
 ${mode=='in'?`<a class='lk2' id='fgl'>Forgot password?</a>`:''}${fg?`<a class='lk2' id='bkl'>← Back to log in</a>`:''}</div>
 <p class='ft' style='color:#fff'>By continuing you agree that coins are for fun and rewards are subject to verification.</p></div>`;
 if($('t1')){$('t1').onclick=()=>showAuth('up');$('t2').onclick=()=>showAuth('in')}
 const sw=t=>{const sv={};['an','ap','ac','ar'].forEach(i=>{if($(i))sv[i]=$(i).value});AU.it=t;showAuth(mode);Object.keys(sv).forEach(i=>{if($(i))$(i).value=sv[i]})};
 $('k1').onclick=()=>sw('m');$('k2').onclick=()=>sw('e');
 if($('fgl'))$('fgl').onclick=()=>showAuth('fg');if($('bkl'))$('bkl').onclick=()=>showAuth('in');
 $('ash').onchange=e=>{['ap','ac'].forEach(i=>{const f=$(i);if(f)f.type=e.target.checked?'text':'password'})};
 if(su){newCap();$('cpr').onclick=newCap}
 $('ago').onclick=async()=>{const er=$('ae');er.style.color='';er.textContent='';const id=normId($('ai').value),pw=$('ap').value,ok=(AU.it=='e'?id.includes('@'):!id.includes('@'))&&okId(id),nm=$('an')?$('an').value.replace(/[<>"']/g,'').trim():'';
  if(su){if(nm.length<3){er.textContent='Enter your full name';return}
   if(!ok){er.textContent=AU.it=='e'?'Enter a valid email address':'Enter a valid mobile number (03XXXXXXXXX)';return}
   if(pw.length<6){er.textContent='Password must be at least 6 characters';return}
   if(pw!==$('ac').value){er.textContent='Passwords do not match';return}
   const rf=($('ar').value||'').trim().toUpperCase();if(rf&&!/^RG[A-Z0-9]{5}$/.test(rf)){er.textContent='Invalid referral code';return}
   if($('ax').value.trim().toUpperCase()!==cap){newCap();$('ax').value='';er.textContent='Wrong captcha, try the new one';return}
   const us=usersG();if(us[id]){er.textContent='This account already exists. Please log in.';return}
   const s=Math.random().toString(36).slice(2),h=await hp(pw,s);us[id]={n:nm,s,h};lss('rg_users',JSON.stringify(us));enter(id,nm,true,rf)}
  else if(fg){if(!ok){er.textContent='Enter your mobile number or email';return}const us=usersG(),u=us[id];
   if(!u||u.n.trim().toLowerCase()!==nm.toLowerCase()){er.textContent='Account or name did not match';return}
   if(pw.length<6){er.textContent='Password must be at least 6 characters';return}if(pw!==$('ac').value){er.textContent='Passwords do not match';return}
   u.s=Math.random().toString(36).slice(2);u.h=await hp(pw,u.s);lss('rg_users',JSON.stringify(us));er.style.color='#86efac';er.textContent='Password updated ✓ Please log in.';setTimeout(()=>showAuth('in'),1300)}
  else{if(Date.now()<(AU.lk||0)){er.textContent='Too many attempts. Wait 30 seconds.';return}
   if(!ok||!pw){er.textContent='Enter your mobile number/email and password';return}
   const u=usersG()[id];if(!u){er.textContent='Account not found. Please sign up.';return}
   const h=await hp(pw,u.s);if(h!==u.h){AU.f=(AU.f||0)+1;if(AU.f>=5){AU.lk=Date.now()+30000;AU.f=0}er.textContent='Wrong password';return}
   AU.f=0;enter(id,u.n,false,'')}}}
hdr();if(UID&&usersG()[UID]){initAds();go('home');syncOnLogin()}else showAuth(Object.keys(usersG()).length?'in':'up');syncSettings();
